name: build-test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # Fast sanity gate: builds the native host tool and runs the C selftests
  # covering CRC tables, embedded payload corruption and SRAM boundary
  # rejection. No cross toolchain needed, so this fails fast on host-tool bugs
  # before any of the slower cross-compiled SoC builds start.
  host-test:
    name: Host tool build + selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build host tool and run selftest
        run: make test

      - name: Upload build artifacts
        if: always()
        uses: https://github.com/christopherHX/gitea-upload-artifact@v4
        with:
          name: host
          path: out/host/
          if-no-files-found: ignore

  format:
    name: Check format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format 20
        run: |
          sudo apt-get update
          if ! sudo apt-get install -y clang-format-20; then
            sudo apt-get install -y wget lsb-release software-properties-common gnupg
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
              | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
            sudo add-apt-repository -y \
              "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-20 main"
            sudo apt-get update
            sudo apt-get install -y clang-format-20
          fi

      - name: Format code and check change
        run: |
          make format CLANG_FORMAT=clang-format-20
          if [[ $(git status --porcelain | wc -l) -gt 0 ]]
          then
            git diff
            echo Run make format
            exit 1
          fi

  # Per-SoC firmware build. Endianness comes from images/<soc>.mk:
  # en751221 and en751627 are big-endian, en7528 and en7580 are little-endian.
  build:
    name: Build ${{ matrix.soc }} (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    needs: host-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - soc: en751221
            toolchain: llvm
          - soc: en751627
            toolchain: llvm
          - soc: en7528
            toolchain: llvm
          - soc: en7580
            toolchain: llvm
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM/Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm

      - name: Build ${{ matrix.soc }}
        continue-on-error: ${{ matrix.experimental == true }}
        run: make LLVM=1 EXPERIMENTAL_SOCS=1 ${{ matrix.soc }}

      - name: Build bootext ${{ matrix.soc }}
        continue-on-error: true
        run: make LLVM=1 EXPERIMENTAL_SOCS=1 ${{ matrix.soc }}-bootext

      - name: Check en751221 bootext image and symbols
        if: matrix.soc == 'en751221'
        run: make LLVM=1 en751221-bootext-check

      - name: Build recovery ${{ matrix.soc }}
        continue-on-error: true
        run: make LLVM=1 EXPERIMENTAL_SOCS=1 ${{ matrix.soc }}-recovery

      - name: Build tcboot ${{ matrix.soc }}
        continue-on-error: ${{ matrix.experimental == true }}
        run: make LLVM=1 EXPERIMENTAL_SOCS=1 ${{ matrix.soc }}-tcboot

      - name: Upload build artifacts
        if: always()
        uses: https://github.com/christopherHX/gitea-upload-artifact@v4
        with:
          name: ${{ matrix.soc }}-${{ matrix.toolchain }}
          path: out/${{ matrix.soc }}/
          if-no-files-found: ignore
